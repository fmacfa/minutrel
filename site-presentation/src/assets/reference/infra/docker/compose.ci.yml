# Recette isolée des images, du proxy, de SQLite et de l’API MCP.
services:
  api:
    image: minutrel-api:ci
    environment:
      APP_SETUP_TOKEN: installation-ci-sans-donnees-reelles
    volumes:
      - ci-data:/app/data
  web:
    image: minutrel-web:ci
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${CI_PORT:-8080}:8080'
volumes:
  ci-data:
