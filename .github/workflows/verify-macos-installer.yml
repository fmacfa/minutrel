name: Verify published macOS installer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-macos-installer.yml'

permissions: {}

jobs:
  open:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    steps:
      - name: Check the published disk image and install the app
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_SHA256: f27dc46bd416d58e1e03ee69e243a3e3e6dad6169f2b695224626330eec13730
        run: |
          curl --fail --location --retry 2 --output Minutrel.dmg https://minutrel.com/downloads/desktop/Minutrel-0.1.1-macOS-Universal.dmg
          echo "$EXPECTED_SHA256  Minutrel.dmg" | shasum -a 256 --check
          hdiutil verify Minutrel.dmg
          mkdir minutrel-volume
          hdiutil attach -readonly -noautoopen -nobrowse -mountpoint "$PWD/minutrel-volume" Minutrel.dmg
          test -s minutrel-volume/.DS_Store
          test -s minutrel-volume/.background.tiff
          test "$(readlink minutrel-volume/Applications)" = /Applications
          grep -q 'section <strong>Sécurité</strong>' minutrel-volume/Installation.html
          grep -q 'Ouvrir quand même' minutrel-volume/Installation.html
          ditto minutrel-volume/Minutrel.app Minutrel.app
          hdiutil detach "$PWD/minutrel-volume"
          lipo Minutrel.app/Contents/MacOS/minutrel -verify_arch arm64 x86_64
          codesign --verify --deep --strict --all-architectures --verbose=2 Minutrel.app
      - name: Open the app and connect it to a team server
        working-directory: ${{ runner.temp }}
        run: |
          cat > team_server.cjs <<'NODE'
          const http = require('node:http');
          const fs = require('node:fs');
          const path = require('node:path');
          const prefs = path.join(require('node:os').homedir(), 'Library/Application Support/app.minutrel.desktop');
          const marker = name => path.join(process.env.RUNNER_TEMP, name);
          const server = http.createServer((req, res) => {
            if (req.url !== '/api/v1/setup') {
              res.writeHead(404).end();
              return;
            }
            res.writeHead(200, {'Content-Type': 'application/json'}).end('{"required":false}');
            fs.writeFileSync(marker('app-checked-team-server'), '');
            console.log('Received the native startup request');
          });
          server.listen(0, '127.0.0.1', () => {
            fs.mkdirSync(prefs, {recursive: true});
            const serverUrl = 'http://127.0.0.1:' + server.address().port;
            fs.writeFileSync(path.join(prefs, 'connection.json'), JSON.stringify({serverUrl, local: false, language: 'fr'}));
            fs.writeFileSync(marker('team-server-ready'), '');
            console.log('Disposable team server ready');
          });
          NODE
          node "$RUNNER_TEMP/team_server.cjs" > "$RUNNER_TEMP/team-server.log" 2>&1 &
          server_pid=$!
          trap 'cat "$RUNNER_TEMP/team-server.log"; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            test -f "$RUNNER_TEMP/team-server-ready" && break
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          test -f "$RUNNER_TEMP/team-server-ready" || { echo 'The test server did not start'; exit 1; }
          open "$PWD/Minutrel.app"
          swift - <<'SWIFT'
          import AppKit
          import CoreGraphics
          let deadline = Date().addingTimeInterval(45)
          repeat {
              let apps = NSRunningApplication.runningApplications(withBundleIdentifier: "app.minutrel.desktop")
              let windows = CGWindowListCopyWindowInfo([.optionAll, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
              for app in apps where app.isFinishedLaunching && !app.isTerminated {
                  let hasMainWindow = windows.contains { window in
                      guard let owner = window[kCGWindowOwnerPID as String] as? Int32,
                            let layer = window[kCGWindowLayer as String] as? Int,
                            let bounds = window[kCGWindowBounds as String] as? [String: Double] else { return false }
                      return owner == app.processIdentifier && layer == 0 && (bounds["Width"] ?? 0) >= 360 && (bounds["Height"] ?? 0) >= 400
                  }
                  if hasMainWindow {
                      print("Minutrel opened its main window")
                      exit(0)
                  }
              }
              Thread.sleep(forTimeInterval: 1)
          } while Date() < deadline
          fatalError("Minutrel did not open a main window")
          SWIFT
          for attempt in {1..50}; do
            test -f "$RUNNER_TEMP/app-checked-team-server" && break
            sleep 1
          done
          test -f "$RUNNER_TEMP/app-checked-team-server"
          echo "The installed Minutrel app reached its configured team server"
